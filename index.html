<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Catlas Meowseum</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width">
</head>

<body>
    <header>
        <h1 style="font-family: 'Unkempt', cursive; font-weight: 700; text-align: center;">Catlas Meowseum</h1>
    </header>

    <main>
        <div class="grid-container">
            <div class="curatorial-statement" style="font-family: 'Unkempt', cursive; font-weight: 400;">
                <h1 style="font-family: 'Unkempt', cursive; font-weight: 700; text-align: center;">Curatorial Statement</h1>
                <p style="font-family: 'Unkempt', cursive; font-weight: 400; text-align: left;">The Catlas Meowseum aims to showcase art from around the world that depicts cats.</p>
                <p style="font-family: 'Unkempt', cursive; font-weight: 400; text-align: left;">The Catlas Meowseum</p>
                 </div>
            <div class="grid-rows">
                <div class="map-panel europe-map">
                    <img src="images/europe.png">
                    <div class="circle-buttons">
                        <button class="circle-button" type="button" data-artwork-index="1" aria-label="Toggle artwork 2 visibility" aria-pressed="false" disabled>+</button>
                        <button class="circle-button" type="button" data-artwork-index="2" aria-label="Toggle artwork 3 visibility" aria-pressed="false" disabled>+</button>
                        <button class="circle-button" type="button" data-artwork-index="3" aria-label="Toggle artwork 4 visibility" aria-pressed="false" disabled>+</button>
                        <button class="circle-button" type="button" data-artwork-index="4" aria-label="Toggle artwork 5 visibility" aria-pressed="false" disabled>+</button>
                    </div>
                </div>
                <div class="map-panel japan-map">
                    <img src="images/japan.png">
                    <div class="circle-buttons">
                        <button class="circle-button" type="button" data-artwork-index="0" aria-label="Toggle artwork 1 visibility" aria-pressed="false" disabled>+</button>
                    </div>
                </div>
            </div>
            <div class="art-gallery" id="art" aria-label="Artwork cards"></div>
        </div>
    </main>
    <script src="js/scripts.js"></script>
</body>

</html>
